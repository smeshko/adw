[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adw"
version = "0.1.0"
description = "Agentic Development Workflow SDK"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "filelock>=3.20.1",
    "pydantic>=2.12.5",
    "python-ulid>=3.1.0",
    "pyyaml>=6.0.3",
    "rich>=14.2.0",
    "typer[all]>=0.21.0",
]

[project.scripts]
adw-final = "adw.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.10",
]
