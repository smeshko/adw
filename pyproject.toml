[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adw"
version = "0.1.0"
description = "Agentic Development Workflow SDK"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "filelock>=3.20.1",
    "pydantic>=2.12.5",
    "python-ulid>=3.1.0",
    "pyyaml>=6.0.3",
    "rich>=14.2.0",
    "typer[all]>=0.21.0",
]

[project.scripts]
adw = "adw.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -q"

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
