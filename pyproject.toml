[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adw"
version = "0.1.18"
description = "Agentic Development Workflow SDK"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "filelock>=3.20.1",
    "httpx>=0.28.1",
    "jsonschema>=4.20.0",
    "pydantic>=2.12.5",
    "python-ulid>=3.1.0",
    "pyyaml>=6.0.3",
    "rich>=14.2.0",
    "typer[all]>=0.21.0",
    "uvicorn[standard]>=0.32.0",
]

[project.scripts]
adw = "adw.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.10",
    "types-jsonschema>=4.20.0",
    "types-pyyaml>=6.0.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--cov=adw",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

[tool.coverage.run]
source = ["src/adw"]
branch = true
omit = ["*/tests/*", "*/__main__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = [
    "httpx",
    "httpx.*",
    "playwright",
    "playwright.*",
]
ignore_missing_imports = true

[tool.hatch.build.targets.wheel]
packages = ["src/adw"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
# HTML templates and multiline strings
"src/adw/cli/logs.py" = ["E501"]
"src/adw/models/__init__.py" = ["E501"]
"src/adw/models/evidence.py" = ["E501"]
# Test data strings and long assertions
"tests/*" = ["E501"]
