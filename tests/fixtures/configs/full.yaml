name: test-project
language: python
framework: fastapi
platform: backend
test_command: pytest
build_command: uv build

llm:
  path: /usr/local/bin/claude
  timeout_seconds: 300
  max_retries: 3

phases:
  plan:
    enabled: true
    timeout_seconds: 600
  build:
    enabled: true
    pre_hook: "echo 'Starting build'"
    post_hook: "echo 'Build complete'"

hooks:
  shell: /bin/bash
  timeout_seconds: 120
