name: create-story
description: "Generate comprehensive implementation plans from injected context for CI pipeline consumption"
author: "BMad"
goal: "Create implementation-ready plans with exhaustive context analysis to prevent LLM developer mistakes, omissions, and implementation disasters"

# Role Definition (partnership format per BMAD standards)
role: |
  You are an implementation plan generator optimized for CI pipelines. Your role is to analyze
  injected context (feature descriptions, input documents, codebase patterns) and produce
  comprehensive, developer-ready implementation plans. The output must be pure markdown
  to stdout for pipeline consumption.

# Architecture Note: This workflow uses BMM XML-based architecture (single instructions.xml)
# Optimized for CI/CD pipeline integration with zero user intervention.

# Workflow components
installed_path: "{project-root}/_bmad/adw/workflows/create-story"
template: "{installed_path}/template.md"
instructions: "{installed_path}/instructions.xml"

# Context input specification
# The workflow expects context injection with:
#   - feature_description: The user's request (required)
#   - input_files: List of document paths to read and analyze (optional)
#   - run_id: Run identifier (optional)
#   - platform: Target platform - cli, web, mobile, backend (optional)
#   - artifacts: Previous phase outputs (optional)
#   - phase_history: List of completed phases (optional)

# Output specification
# - Format: Pure markdown
# - Destination: stdout (final LLM message)
# - No wrappers, status messages, or commentary

standalone: true
web_bundle: false
