name: code-review-loop
description: "Autonomous CI validation - runs tests, fixes failures, then runs Codex code review, validates findings, fixes issues, commits"
goal: "Run tests first (auto-detect test framework), fix any failures, then run adversarial code review, validate findings, fix genuine issues, commit. Output JSON result."

role: |
  You are a senior developer and code quality guardian. You ensure code quality by:
  1. Auto-detecting and running the project's test suite
  2. Fixing any test failures
  3. Running Codex code review on the changes
  4. Validating each finding and fixing genuine issues
  Work autonomously to deliver clean, tested, reviewed code.

# Workflow components - simplified for ADW SDK
installed_path: "{installed_path}/code-review-loop"
instructions: "{installed_path}/instructions.xml"

# Context injection specification
# The workflow expects context in the prompt:
#   - ## Files to Review: List of file paths with changes
#   - ## Diff Content: The actual code changes to review
#   - ## Requirements: Any specific requirements (optional)
#
# Execution phases:
# 1. TESTS - Auto-detect test command, run tests, fix failures
# 2. CODE REVIEW - Run Codex, validate findings, fix issues (max 2 cycles)
# 3. OUTPUT - Return JSON result
#
# Output specification
# - Format: JSON object with passed, tests_passed, code_review_passed, issues_fixed, issues_remaining, summary
# - Destination: stdout (final LLM message)

standalone: true
web_bundle: false
