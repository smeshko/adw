<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}ADW Dashboard{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5/full.css" rel="stylesheet" type="text/css" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="/static/htmx.min.js"></script>
  <style>
    .htmx-swapping { opacity: 0; transition: opacity 100ms ease-out; }
    .htmx-settling { opacity: 1; transition: opacity 200ms ease-in; }
  </style>
  <script>
    /* Restore theme from localStorage before paint */
    (function() {
      var t = localStorage.getItem('adw-theme');
      if (t) document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body class="min-h-screen bg-base-200">
  <header class="navbar bg-base-100 shadow-sm px-4">
    <div class="flex-1">
      <a href="/" class="text-lg font-bold" hx-get="/" hx-target="#main" hx-push-url="/">ADW Dashboard</a>
    </div>
    <div class="flex-none gap-2">
      <a href="/" class="btn btn-ghost btn-sm {% if page == 'overview' %}font-semibold border-b-2 border-primary{% endif %}"
         hx-get="/" hx-target="#main" hx-push-url="/">Overview</a>
    </div>
  </header>

  <main id="main" class="container mx-auto p-4">
    {% block content %}{% endblock %}
  </main>

  <footer id="status-bar" class="footer footer-center p-2 bg-base-100 text-base-content/60 text-xs">
    <p>ADW Dashboard</p>
  </footer>
</body>
</html>
