{# Toast notification partial — rendered via OOB swap into #toast-container #}
<div id="toast-container" hx-swap-oob="innerHTML">
  <div class="alert alert-{{ toast_type | default('success') }} shadow-lg">
    <span>{{ toast_message }}</span>
  </div>
  <script>
    setTimeout(function() {
      var t = document.getElementById('toast-container');
      if (t) t.innerHTML = '';
    }, 3000);
  </script>
</div>
