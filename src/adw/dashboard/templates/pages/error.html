{% extends "base.html" %}

{% block title %}Error — ADW Dashboard{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-[50vh]">
  <div class="card bg-base-100 shadow-sm p-8 max-w-lg w-full text-center">
    <h1 class="text-4xl font-bold text-error mb-2">{{ status_code | default(500) }}</h1>
    <p class="text-lg text-base-content/70 mb-4">{{ error_message | default('An unexpected error occurred.') }}</p>
    <a href="/" class="btn btn-primary btn-sm">Return to Overview</a>
  </div>
</div>
{% endblock %}
