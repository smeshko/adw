# Configuration for the ship phase
# Handles version bumping, building, publishing, and PR merge automation
# Override in project's .adw/commands/ship/config.yaml

# Timeout for the ship phase (15 minutes - includes potential deployment steps)
timeout_seconds: 900

# === Deployment Commands ===
# Shell commands executed during ship phase (all optional)
# Note: build_command is configured at the project level in project.yaml
# commands:
#   version_bump: npm version patch  # Command to bump version
#   publish: npm publish             # Command to publish/deploy

# === Post-Publish Hooks ===
# Commands to run after publishing (e.g., push tags)
# post_publish:
#   - git push --tags
#   - echo "Deployed successfully!"

# === PR Automation ===
# Controls pull request handling during ship phase
# pr:
#   merge_on_success: false          # Auto-merge PR after validation
#   delete_branch_on_merge: true     # Delete branch after merge
#   merge_method: squash             # Merge method (merge/squash/rebase)
#   bypass_ci: false                 # Bypass CI checks using --admin (requires admin access)

# Input files for ship phase come from document phase artifacts
# These are typically auto-loaded via artifact references in the prompt
# input_files:
#   pr_description: artifacts/document/pr_description.md

# LLM settings for this phase
# llm:
#   model: claude-sonnet-4-20250514
#   temperature: 0.3  # Lower temperature for deployment decisions

# Artifacts to capture from this phase
artifacts:
  - name: ship_report
    pattern: "ship_report.md"
    required: true
    description: "Full deployment report from LLM"
  - name: release_notes
    pattern: "release_notes.md"
    required: false
    description: "Generated release notes"
