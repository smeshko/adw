# Configuration for the document phase
# Analyzes changes, updates documentation, creates feature docs, generates PR description

# Timeout for the document phase (10 minutes - includes doc analysis and updates)
timeout_seconds: 600

# Input files for document phase come from previous phase artifacts
# These are typically auto-loaded via artifact references in the prompt
# input_files:
#   implementation: artifacts/build/build_output.md

# LLM settings for this phase
# llm:
#   model: claude-sonnet-4-20250514
#   temperature: 0.5  # Moderate temperature for documentation

# Artifacts to capture from this phase
artifacts:
  - name: document_output
    pattern: "document_output.md"
    required: true
    description: "Document phase output including analysis report"
  - name: pr_description
    pattern: "pr_description.md"
    required: true
    description: "Generated PR description"
  - name: feature_doc
    pattern: "feature_doc.md"
    required: false
    description: "Feature documentation if significant changes detected"
