# Configuration for the document phase
# Analyzes changes, updates documentation, creates feature docs, generates PR description

# Timeout for the document phase (10 minutes - includes doc analysis and updates)
timeout_seconds: 600

# Input files for document phase come from previous phase artifacts
# These are typically auto-loaded via artifact references in the prompt
# input_files:
#   implementation: artifacts/build/build_output.md

# LLM settings for this phase
# llm:
#   model: claude-sonnet-4-20250514

# Map source files to documentation directories for automatic updates
# When files matching source_pattern change, the document phase looks for
# corresponding docs in docs_dir (matched by filename stem: foo.py -> foo.md)
# Example:
# doc_mappings:
#   - source_pattern: "src/adw/core/**/*.py"
#     docs_dir: "docs/architecture/deep-dive"
#   - source_pattern: "src/adw/cli/**/*.py"
#     docs_dir: "docs/cli"
#   - source_pattern: "src/adw/models/**/*.py"
#     docs_dir: "docs/models"
