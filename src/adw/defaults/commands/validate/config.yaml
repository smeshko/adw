# Default configuration for the validate phase
# These defaults can be overridden in project's .adw/commands/validate/config.yaml

# Timeout for the validate phase (10 minutes for full validation loop)
timeout_seconds: 600

# === Validation Settings ===
# Controls which validators run and their behavior

# Enable/disable specific validators
enable_evidence: true   # Run evidence validator
enable_review: true     # Run code review validator
enable_tests: true      # Run test validator

# Test execution settings
# Note: test_command is configured at the project level in project.yaml

# Iteration and fix attempt limits
max_iterations: 5               # Maximum validation loop iterations
max_fix_attempts_per_issue: 2   # Max attempts to fix a single issue
stall_threshold: 2              # Iterations without progress before stall

# Issue triage behavior
triage_mode: auto       # How to handle issues (auto/manual/hybrid)
auto_dismiss_info: true # Automatically dismiss info-level issues

# Input files for validate phase
# input_files:
#   output: artifacts/validate/validate_output.md

# LLM settings for this phase
# llm:
#   model: claude-sonnet-4-20250514
#   temperature: 0.0  # Zero temperature for deterministic validation

# Artifacts to capture from this phase
artifacts:
  - name: validate_output
    pattern: "validate_output.md"
    required: true
    description: "Validation results"
