# Default configuration for the verify phase
# These defaults can be overridden in project's adw.yaml

# Timeout for the verify phase (15 minutes default - includes running tests)
timeout_seconds: 900

# Input files for verify phase typically come from previous phase artifacts
# input_files:
#   implementation: artifacts/build/build_output.md

# LLM settings for this phase
# llm:
#   model: claude-sonnet-4-20250514
#   temperature: 0.3  # Lower temperature for verification

# Artifacts to capture from this phase
artifacts:
  - name: verify_output
    pattern: "verify_output.md"
    required: true
    description: "Verification results and test output"
  - name: evidence_manifest
    pattern: "evidence_manifest.json"
    required: false
    description: "Evidence manifest for PR documentation"
